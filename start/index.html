<script>
(function(){
const RM=matchMedia("(prefers-reduced-motion: reduce)").matches;
let ov=null,from=null;
function open(name,el){
  if(ov)return;
  from=el;
  ov=document.createElement("div");ov.className="ov";ov.setAttribute("role","dialog");ov.setAttribute("aria-modal","true");
  ov.setAttribute("aria-label",name==="start"?"Wollyの始め方":"ジャンル別スキマバイト一覧");

  const sc=ov.querySelector(".sc");sc.appendChild(document.getElementById("t-"+name).content.cloneNode(true));
  const b=document.createElement("button");b.type="button";b.className="back";b.textContent="とじて、もどる";sc.appendChild(b);
  const sh=ov.querySelector(".sh");
  if(el){const r=el.getBoundingClientRect();sh.style.setProperty("--fx",(r.left+r.width/2-innerWidth/2)+"px");sh.style.setProperty("--fy",(r.top-26)+"px")}
  document.body.appendChild(ov);document.body.style.overflow="hidden";
  history.pushState({sheet:name},"","#"+name);
  requestAnimationFrame(()=>requestAnimationFrame(()=>ov.classList.add("on")));
  ov.addEventListener("click",e=>{if(e.target===ov||e.target.closest(".x,.back"))history.back()});
  ov.querySelector(".x").focus({preventScroll:true});
}
function close(){
  if(!ov)return;const o=ov;ov=null;o.classList.remove("on");document.body.style.overflow="";
  setTimeout(()=>o.remove(),RM?0:420);from&&from.focus&&from.focus({preventScroll:true});
}

addEventListener("keydown",e=>{if(e.key==="Escape"&&ov)history.back()});
document.addEventListener("click",e=>{
  const s=e.target.closest("[data-sheet]");
  if(s){e.preventDefault();s.classList.remove("pop");void s.offsetWidth;s.classList.add("pop");setTimeout(()=>open(s.dataset.sheet,s),RM?0:160);return}

});
